plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '0.1.0-rehearsal'
group = 'com.injaa.villagedawn'
base { archivesName = 'VillageDawn-Forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { villagedawn { source sourceSets.main } }
        }
        client {}
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'villagedawn' }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.20' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
