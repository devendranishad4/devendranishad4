plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '1.0.0'
group = 'com.injaa.room203'
base { archivesName = 'Room203-Sayama-Forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
 mappings channel: 'official', version: '1.20.1'
 runs {
  configureEach { workingDirectory project.file('run'); property 'forge.logging.console.level','info'; mods { room203 { source sourceSets.main } } }
  client {}
  gameTestServer { property 'forge.enabledGameTestNamespaces','room203' }
 }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
