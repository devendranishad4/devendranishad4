name: Build Minecraft Mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'minecraft-mod-builds/**'
      - '.github/workflows/build-minecraft-mods.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct base sources
        shell: bash
        run: |
          cat minecraft-mod-builds/light.parts/part00 \
              minecraft-mod-builds/light.parts/part01 \
              minecraft-mod-builds/light.parts/part02 \
              minecraft-mod-builds/light.parts/part03 \
              minecraft-mod-builds/light.parts/part04 \
            | base64 -d > /tmp/light.zip
          cat minecraft-mod-builds/phone-clean.parts/part00 \
              minecraft-mod-builds/phone-clean.parts/part01 \
            | base64 -d > /tmp/phone.zip
          unzip -q /tmp/light.zip -d /tmp/light-src
          unzip -q /tmp/phone.zip -d /tmp/phone-src
          cp minecraft-mod-builds/phone-overrides/build.gradle /tmp/phone-src/PhoneV3_Clean_Source/build.gradle

      - name: Apply Light Director V2 patches
        shell: bash
        run: |
          mkdir -p /tmp/light-src/LightDirectorRemote_Source/src/main/java/com/injaa/lightdirector/registry
          cp minecraft-mod-builds/v2patch/light/LightDirectorManager.java /tmp/light-src/LightDirectorRemote_Source/src/main/java/com/injaa/lightdirector/server/LightDirectorManager.java
          cp minecraft-mod-builds/v2patch/light/ModCreativeTabs.java /tmp/light-src/LightDirectorRemote_Source/src/main/java/com/injaa/lightdirector/registry/ModCreativeTabs.java
          cp minecraft-mod-builds/v2patch/light/LightDirectorMod.java /tmp/light-src/LightDirectorRemote_Source/src/main/java/com/injaa/lightdirector/LightDirectorMod.java

      - name: Apply Phone V3.1 patches
        shell: bash
        run: |
          mkdir -p /tmp/phone-src/PhoneV3_Clean_Source/src/main/java/com/injaa/phonev3/client
          mkdir -p /tmp/phone-src/PhoneV3_Clean_Source/src/main/java/com/injaa/phonev3/registry
          cp minecraft-mod-builds/v2patch/phone/PhoneV3Addon.java /tmp/phone-src/PhoneV3_Clean_Source/src/main/java/com/injaa/phonev3/PhoneV3Addon.java
          cp minecraft-mod-builds/v2patch/phone/PhoneCreativeTab.java /tmp/phone-src/PhoneV3_Clean_Source/src/main/java/com/injaa/phonev3/registry/PhoneCreativeTab.java
          cp minecraft-mod-builds/v2patch/phone/PhoneUpgradeHooks.java /tmp/phone-src/PhoneV3_Clean_Source/src/main/java/com/injaa/phonev3/client/PhoneUpgradeHooks.java
          cp minecraft-mod-builds/v2patch/phone/PhoneV31Screen.java /tmp/phone-src/PhoneV3_Clean_Source/src/main/java/com/injaa/phonev3/client/PhoneV31Screen.java

      - name: Build Light Director V2
        working-directory: /tmp/light-src/LightDirectorRemote_Source
        run: gradle clean build --stacktrace

      - name: Build Advanced Phone V3.1
        working-directory: /tmp/phone-src/PhoneV3_Clean_Source
        run: gradle clean build --stacktrace

      - name: Collect JARs
        shell: bash
        run: |
          mkdir -p /tmp/jars
          cp /tmp/light-src/LightDirectorRemote_Source/build/libs/*.jar /tmp/jars/
          cp /tmp/phone-src/PhoneV3_Clean_Source/build/libs/*.jar /tmp/jars/
          ls -lh /tmp/jars

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mods-V2-V31
          path: /tmp/jars/*.jar
          if-no-files-found: error
