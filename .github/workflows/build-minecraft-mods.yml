name: Build Minecraft Mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'minecraft-mod-builds/**'
      - '.github/workflows/build-minecraft-mods.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct Phone V3.2
        shell: bash
        run: |
          mkdir -p /tmp/phone32
          base64 -d minecraft-mod-builds/v32/phone-v32.tar.xz.b64 > /tmp/phone32.tar.xz
          tar -xJf /tmp/phone32.tar.xz -C /tmp/phone32
          rm -f /tmp/phone32/PhoneV3_Clean_Source/src/main/java/com/injaa/phonev3/client/PhoneV31Screen.java
          cat > /tmp/phone32/PhoneV3_Clean_Source/build.gradle <<'EOF'
          plugins {
              id 'eclipse'
              id 'idea'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          group = 'com.injaa.phonev3'
          version = '1.0.0'
          base { archivesName = 'AdvancedPhoneV3-Addon-Forge-1.20.1' }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
              copyIdeResources = true
          }

          repositories { mavenCentral() }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
          }

          processResources {
              def replaceProperties = [mod_version: project.version]
              inputs.properties replaceProperties
              filesMatching(['META-INF/mods.toml']) { expand replaceProperties + [project: project] }
          }

          jar.finalizedBy('reobfJar')
          EOF

      - name: Reconstruct Light Director V2.1
        shell: bash
        run: |
          mkdir -p /tmp/light21
          base64 -d minecraft-mod-builds/v32/light-v21.tar.xz.b64 > /tmp/light21.tar.xz
          tar -xJf /tmp/light21.tar.xz -C /tmp/light21

      - name: Build Advanced Phone V3.2
        working-directory: /tmp/phone32/PhoneV3_Clean_Source
        run: gradle clean build --stacktrace

      - name: Build Light Director V2.1
        working-directory: /tmp/light21/LightDirectorRemote_Source
        run: gradle clean build --stacktrace

      - name: Collect JARs
        shell: bash
        run: |
          mkdir -p /tmp/jars
          cp /tmp/phone32/PhoneV3_Clean_Source/build/libs/*.jar /tmp/jars/
          cp /tmp/light21/LightDirectorRemote_Source/build/libs/*.jar /tmp/jars/
          ls -lh /tmp/jars

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mods-V32-V21
          path: /tmp/jars/*.jar
          if-no-files-found: error
