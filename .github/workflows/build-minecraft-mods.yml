name: Build Minecraft Mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'minecraft-mod-builds/**'
      - '.github/workflows/build-minecraft-mods.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct Phone V3.2
        shell: bash
        run: |
          base64 -d minecraft-mod-builds/v32/phone-v32.zip.b64 > /tmp/phone32.zip
          unzip -q /tmp/phone32.zip -d /tmp/phone32

      - name: Reconstruct Light Director V2.1
        shell: bash
        run: |
          base64 -d minecraft-mod-builds/v32/light-v21.zip.b64 > /tmp/light21.zip
          unzip -q /tmp/light21.zip -d /tmp/light21

      - name: Build Advanced Phone V3.2
        working-directory: /tmp/phone32/PhoneV3_Clean_Source
        run: gradle clean build --stacktrace

      - name: Build Light Director V2.1
        working-directory: /tmp/light21/LightDirectorRemote_Source
        run: gradle clean build --stacktrace

      - name: Collect JARs
        shell: bash
        run: |
          mkdir -p /tmp/jars
          cp /tmp/phone32/PhoneV3_Clean_Source/build/libs/*.jar /tmp/jars/
          cp /tmp/light21/LightDirectorRemote_Source/build/libs/*.jar /tmp/jars/
          ls -lh /tmp/jars

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mods-V32-V21
          path: /tmp/jars/*.jar
          if-no-files-found: error
