name: Build Clean Director Mods
on:
  push:
    branches: [ minecraft-horror-builds ]
    paths:
      - 'minecraft-mods/light-director-v3/**'
      - 'minecraft-mods/slenderman-v2/**'
      - '.github/workflows/build-horror-mods.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [light-director-v3, slenderman-v2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle -p minecraft-mods/${{ matrix.project }} clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-forge-1.20.1
          path: minecraft-mods/${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
