name: Build Train31 Tokyo Horror V3

on:
  push:
    branches: [ "train31-cinematic-v2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate cinematic assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --quiet pillow edge-tts
          python tools/generate_assets.py
          mkdir -p src/main/resources/assets/train31/sounds build/preview

          make_pa() {
            NAME="$1"
            TEXT="$2"
            RATE="$3"
            set +e
            edge-tts --voice en-US-AriaNeural --rate="$RATE" --pitch="+0Hz" --text "$TEXT" --write-media "/tmp/${NAME}.mp3"
            CODE=$?
            set -e
            if [ $CODE -ne 0 ]; then
              espeak-ng -v en+f3 -s 130 -p 52 -a 145 -w "/tmp/${NAME}.wav" "$TEXT"
              ffmpeg -y -loglevel error -i "/tmp/${NAME}.wav" "/tmp/${NAME}.mp3"
            fi
          }

          make_girl() {
            NAME="$1"
            TEXT="$2"
            RATE="$3"
            set +e
            edge-tts --voice en-US-JennyNeural --rate="$RATE" --pitch="-1Hz" --text "$TEXT" --write-media "/tmp/${NAME}_raw.mp3"
            CODE=$?
            set -e
            if [ $CODE -ne 0 ]; then
              espeak-ng -v en+f4 -s 102 -p 58 -a 135 -w "/tmp/${NAME}.wav" "$TEXT"
              ffmpeg -y -loglevel error -i "/tmp/${NAME}.wav" "/tmp/${NAME}_raw.mp3"
            fi
            ffmpeg -y -loglevel error -i "/tmp/${NAME}_raw.mp3" -filter_complex \
              "[0:a]asplit=2[a][b];[b]adelay=70|70,volume=0.18[b2];[a][b2]amix=inputs=2:normalize=0,highpass=f=145,lowpass=f=3500,acompressor=threshold=-24dB:ratio=2.0:attack=12:release=160,aecho=0.8:0.17:120:0.13,volume=1.28[out]" \
              -map "[out]" -c:a libvorbis -q:a 6 "src/main/resources/assets/train31/sounds/${NAME}.ogg"
          }

          make_pa pa_normal "Attention please. The last service has ended. Platform three is closed." -8%
          make_pa pa_train31 "Attention please. Train thirty one is approaching. Please stand behind the line." -12%
          ffmpeg -y -loglevel error -i /tmp/pa_normal.mp3 -af "highpass=f=170,lowpass=f=6100,aecho=0.8:0.24:100:0.10" -c:a libvorbis -q:a 6 src/main/resources/assets/train31/sounds/pa_normal.ogg
          ffmpeg -y -loglevel error -i /tmp/pa_train31.mp3 -af "highpass=f=170,lowpass=f=5200,aecho=0.8:0.28:115:0.14" -c:a libvorbis -q:a 6 src/main/resources/assets/train31/sounds/pa_train31.ogg

          # ONE consistent girl voice. Neutral English accent; horror comes from close whisper processing, not pitch-down.
          make_girl whisper_injaa "Injaa..." -27%
          make_girl whisper_can_see "Can you see me?" -25%
          make_girl whisper_behind "Don't turn around..." -28%
          make_girl whisper_here "You shouldn't be here." -25%
          make_girl whisper_why_here "Why did you come here?" -24%
          make_girl whisper_coming "It's coming..." -30%
          make_girl whisper_dont_board "Don't get on that train." -27%
          make_girl whisper_see_you "I can see you..." -26%
          make_girl whisper_cant_leave "You can't leave now." -27%
          make_girl whisper_run "Injaa... run." -22%
          make_girl whisper_found_you "I found you." -30%
          make_girl whisper_should_listen "You should have listened..." -31%

          # In-game style MP3 preview using the exact same voice/effects chain.
          set +e
          edge-tts --voice en-US-JennyNeural --rate="-27%" --pitch="-1Hz" --text "Injaa... Don't turn around... I can see you... You shouldn't be here." --write-media /tmp/voice_preview_raw.mp3
          PREVIEW_CODE=$?
          set -e
          if [ $PREVIEW_CODE -ne 0 ]; then
            espeak-ng -v en+f4 -s 102 -p 58 -a 135 -w /tmp/voice_preview.wav "Injaa... Don't turn around... I can see you... You shouldn't be here."
            ffmpeg -y -loglevel error -i /tmp/voice_preview.wav /tmp/voice_preview_raw.mp3
          fi
          ffmpeg -y -loglevel error -i /tmp/voice_preview_raw.mp3 -filter_complex \
            "[0:a]asplit=2[a][b];[b]adelay=70|70,volume=0.18[b2];[a][b2]amix=inputs=2:normalize=0,highpass=f=145,lowpass=f=3500,acompressor=threshold=-24dB:ratio=2.0:attack=12:release=160,aecho=0.8:0.17:120:0.13,volume=1.28[out]" \
            -map "[out]" -c:a libmp3lame -q:a 2 build/preview/Train31_InGame_Voice_Preview.mp3

          python tools/generate_audio.py
      - name: Build
        run: gradle build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Train31-Tokyo-Horror-V3-Forge-1.20.1
          path: build/libs/*.jar
      - name: Upload voice preview
        uses: actions/upload-artifact@v4
        with:
          name: Train31-InGame-Voice-Preview
          path: build/preview/Train31_InGame_Voice_Preview.mp3
