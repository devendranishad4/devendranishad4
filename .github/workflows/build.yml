name: Build Train31 Tokyo Horror V3

on:
  push:
    branches: [ "train31-cinematic-v2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Generate cinematic assets and human horror voices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --quiet pillow edge-tts 'gdown>=6.1.0'
          python tools/generate_assets.py
          mkdir -p src/main/resources/assets/train31/sounds build/preview

          # Station PA remains synthetic because it is an artificial public-address system,
          # not the ghost girl. The ghost-girl voice is handled separately below using
          # real human recordings from Alesia-Davina's public royalty-free horror bundle.
          make_pa() {
            NAME="$1"
            TEXT="$2"
            RATE="$3"
            set +e
            edge-tts --voice en-US-AriaNeural --rate="$RATE" --pitch="+0Hz" --text "$TEXT" --write-media "/tmp/${NAME}.mp3"
            CODE=$?
            set -e
            if [ $CODE -ne 0 ]; then
              espeak-ng -v en+f3 -s 130 -p 52 -a 145 -w "/tmp/${NAME}.wav" "$TEXT"
              ffmpeg -y -loglevel error -i "/tmp/${NAME}.wav" "/tmp/${NAME}.mp3"
            fi
          }

          make_pa pa_normal "Attention please. The last service has ended. Platform three is closed." -8%
          make_pa pa_train31 "Attention please. Train thirty one is approaching. Please stand behind the line." -12%
          ffmpeg -y -loglevel error -i /tmp/pa_normal.mp3 -af "highpass=f=170,lowpass=f=6100,aecho=0.8:0.24:100:0.10" -c:a libvorbis -q:a 6 src/main/resources/assets/train31/sounds/pa_normal.ogg
          ffmpeg -y -loglevel error -i /tmp/pa_train31.mp3 -af "highpass=f=170,lowpass=f=5200,aecho=0.8:0.28:115:0.14" -c:a libvorbis -q:a 6 src/main/resources/assets/train31/sounds/pa_train31.ogg

          # Real human horror performances only for the girl. This script reads the
          # creator's public Google Drive bundle, selects matching recorded phrases,
          # and intentionally leaves a missing line silent rather than falling back to TTS.
          python tools/fetch_human_voices.py

          # Original non-dialogue Train 31 ambience/SFX.
          python tools/generate_audio.py

      - name: Build
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Train31-Tokyo-Horror-V3-Forge-1.20.1
          path: build/libs/*.jar

      - name: Upload human voice preview
        uses: actions/upload-artifact@v4
        with:
          name: Train31-Real-Human-Voice-Preview
          path: |
            build/preview/Train31_Real_Human_Voice_Preview.mp3
            build/preview/Train31_Human_Voice_Selection.txt
