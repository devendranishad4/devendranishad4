name: Build Train31 Forge Mod

on:
  push:
    branches: [ "train31-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Train31Director-Forge-1.20.1
          path: build/libs/*.jar
